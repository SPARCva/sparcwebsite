# Netlify configuration for SPARC website
#
# NOTE: sparcsolutions.org and www.sparcsolutions.org are both served by GitHub
# Pages from this repository (CNAME + .nojekyll), not by Netlify — check with
# `curl -sI https://sparcsolutions.org | grep server`. Nothing in this file
# affects the live site today; it is served as a plain file at
# /netlify.toml. The rules here apply only to the Netlify project
# (main--sparcwebsite.netlify.app) and to deploy previews.
#
# GitHub Pages serves static files only: no rewrites, no proxies, no custom
# headers. So anything that needs to appear under a path on the live domain has
# to be a real file in this repo. That is why /devdash is a page in devdash/
# rather than a rewrite to the dashboard's own project.

[build]
  publish = "."

# Steps Toward Access app — proxied from its own Netlify site.
# Must precede the catch-all pretty-URL rule; force=true so no local
# file can shadow it. The app is built with basePath /accessibility.
[[redirects]]
  from = "/accessibility"
  to = "https://stepstowardaccess.netlify.app/accessibility"
  status = 200
  force = true

[[redirects]]
  from = "/accessibility/*"
  to = "https://stepstowardaccess.netlify.app/accessibility/:splat"
  status = 200
  force = true

# Redirect board-portal.html to board-portal directory
[[redirects]]
  from = "/board-portal.html"
  to = "/board-portal/"
  status = 301

# Blog has been consolidated into the News page
[[redirects]]
  from = "/blog"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/news/"
  status = 301

# Enable pretty URLs (removes .html extension)
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Redirect home.html to root
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Root serves home.html
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
