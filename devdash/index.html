<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Development Dashboard — SPARC</title>

<!-- WHY THIS IS A FILE AND NOT A REWRITE — please read before "fixing" it.
     ================================================================
     sparcsolutions.org is answered by GitHub Pages, from this repository.
     Not by Netlify. The Netlify project `sparcwebsite` is real, is claimed,
     deploys fine and lists sparcsolutions.org as its primary URL — which is
     exactly why this is so easy to get wrong.

     Check it in one command before changing anything here:

         curl -sI https://sparcsolutions.org | grep server     ->  GitHub.com
         curl -s  https://sparcsolutions.org/netlify.toml      ->  200, the file

     That second one is the proof. A host that hands you netlify.toml as a
     download is not reading it. Netlify consumes that file and returns 404
     for it; try the same path on main--sparcwebsite.netlify.app.

     GitHub Pages serves static files and nothing else: no rewrites, no
     proxies, no custom headers. So a path on the live domain has to be a
     real file in this repo. /accessibility works the same way — it is
     accessibility/index.html, not the proxy rule that also sits in
     netlify.toml for it.

     This has been reverted to a `status = 200` proxy twice (21 Aug, then
     25 Aug in 6af0662) and both times sparcsolutions.org/devdash went to a
     404 for staff while still working on *.netlify.app, which is where it
     gets tested. .github/workflows/devdash-guard.yml now fails the build if
     this file goes missing again.

     The dashboard is NOT copied here on purpose. It holds donor names,
     addresses and gift amounts, and its own Netlify project sends a
     Content-Security-Policy, X-Frame-Options and X-Robots-Tag that GitHub
     Pages cannot send at all. Forwarding keeps the app on its hardened
     origin and keeps one copy of it. The cost is that the address bar
     changes after the hop.

     No analytics here, unlike the rest of this site. This is the doorway to
     a screen full of donor records. -->

<link rel="canonical" href="https://sparc-donor-ops.netlify.app/devdash/">
<meta http-equiv="refresh" content="0; url=https://sparc-donor-ops.netlify.app/devdash/">
<style>
  :root { --ink:#10203d; --paper:#f4f5f8; --muted:#5b6478; }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center;
    justify-content:center; padding:1.5rem; background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .card {
    background:#fff; border-radius:12px; padding:2rem 2.25rem; max-width:26rem;
    width:100%; box-shadow:0 1px 3px rgba(16,32,61,.08); text-align:center;
  }
  .mark { font-weight:800; letter-spacing:-.02em; font-size:1.35rem; }
  .mark span {
    font-weight:600; font-size:.7rem; letter-spacing:.09em;
    text-transform:uppercase; color:var(--muted); margin-left:.4rem;
  }
  p { color:var(--muted); font-size:.95rem; line-height:1.5; margin:1rem 0 1.5rem; }
  a.btn {
    display:inline-block; background:var(--ink); color:#fff; text-decoration:none;
    font-weight:600; padding:.7rem 1.4rem; border-radius:8px;
  }
  a.btn:hover, a.btn:focus { background:#1c3763; }
  a.btn:focus-visible { outline:3px solid #1c3763; outline-offset:3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">SPARC<span>Development Dashboard</span></div>
    <p>Taking you to the dashboard. If nothing happens, use the button below.</p>
    <a class="btn" href="https://sparc-donor-ops.netlify.app/devdash/">Open the dashboard</a>
  </main>
  <script>
    // replace() rather than assign(), so Back does not bounce off this page.
    location.replace("https://sparc-donor-ops.netlify.app/devdash/");
  </script>
</body>
</html>
