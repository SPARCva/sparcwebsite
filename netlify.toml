# Netlify configuration for SPARC website

[build]
  publish = "."

# Steps Toward Access app — proxied from its own Netlify site.
# Must precede the catch-all pretty-URL rule; force=true so no local
# file can shadow it. The app is built with basePath /accessibility.
[[redirects]]
  from = "/accessibility"
  to = "https://stepstowardaccess.netlify.app/accessibility"
  status = 200
  force = true

[[redirects]]
  from = "/accessibility/*"
  to = "https://stepstowardaccess.netlify.app/accessibility/:splat"
  status = 200
  force = true

# Donor Operations dashboard (/devdash) — internal staff tool, proxied from its
# own Netlify project `sparc-donor-ops` (repo SPARCva/sparc-donor-ops). Nothing
# is copied into this repo: that project stays the single source of truth and a
# push to its main branch updates /devdash immediately.
#
# Both rules must precede the catch-all pretty-URL rule; force=true so no local
# file can shadow them. The dashboard is built with basePath /devdash, the same
# way the accessibility app above is, so its asset references are absolute and
# resolve whether or not the visitor typed the trailing slash.
#
# Do not replace the first rule with a 301 to /devdash/: Netlify matches
# /devdash and /devdash/ as the same path, so that rule redirects to itself and
# the page never loads.
[[redirects]]
  from = "/devdash"
  to = "https://sparc-donor-ops.netlify.app/devdash"
  status = 200
  force = true

[[redirects]]
  from = "/devdash/*"
  to = "https://sparc-donor-ops.netlify.app/devdash/:splat"
  status = 200
  force = true

# The dashboard shows donor names, addresses and gift amounts. It sets these
# headers on its own project too; they are repeated here so the posture does not
# depend on what survives the proxy hop. Keep the two copies in agreement —
# the source is netlify.toml in SPARCva/sparc-donor-ops.
[[headers]]
  for = "/devdash/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cross-Origin-Opener-Policy = "same-origin"
    Cache-Control = "no-store, max-age=0"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self';
      style-src 'self';
      font-src 'self';
      img-src 'self' data:;
      connect-src https://ldxpockcgcxvsrbyhcnt.supabase.co;
      form-action 'self';
      frame-ancestors 'none';
      base-uri 'none';
      object-src 'none'
    """

# Redirect board-portal.html to board-portal directory
[[redirects]]
  from = "/board-portal.html"
  to = "/board-portal/"
  status = 301

# Blog has been consolidated into the News page
[[redirects]]
  from = "/blog"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/news/"
  status = 301

# Enable pretty URLs (removes .html extension)
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Redirect home.html to root
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Root serves home.html
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
