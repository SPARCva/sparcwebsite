      <line x1="115" y1="130" x2="197" y2="130"/>
      <line x1="115" y1="130" x2="173" y2="188"/>
      <line x1="115" y1="130" x2="115" y2="212"/>
      <line x1="115" y1="130" x2="57"  y2="188"/>
      <line x1="115" y1="130" x2="33"  y2="130"/>
      <line x1="115" y1="130" x2="57"  y2="72"/>
      <line x1="115" y1="130" x2="115" y2="48"/>
      <line x1="115" y1="130" x2="173" y2="72"/>
    </g>
  </g>
  <!-- Wordmark -->
  <text x="252" y="150" font-family="'Montserrat','Trebuchet MS',sans-serif" font-size="112" font-weight="500" fill="#0E2C4E" letter-spacing="1">clover leaf</text>
  <text x="256" y="205" font-family="'Montserrat','Trebuchet MS',sans-serif" font-size="39" font-weight="500" fill="#0E2C4E" letter-spacing="13">wealth strategies</text>
