<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Internal tool: keep it out of search results. robots.txt also
         disallows this path; analytics are deliberately omitted. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Photo Gallery Admin | SPARC</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/photo-gallery-admin.css">
</head>
<body class="pga">
    <a href="#pga-view" class="skip-link">Skip to main content</a>

    <div class="pga-bar">
        <img src="/images/SPARC_logo_white.png" alt="SPARC">
        <h1>Photo Gallery Admin</h1>
        <div class="pga-bar-spacer"></div>
        <a class="pga-btn pga-btn-icon" id="pga-view-public" href="/photogallery/" target="_blank" rel="noopener" hidden>
            View public gallery
        </a>
        <button class="pga-btn pga-btn-icon" type="button" id="pga-signout" hidden>Sign out</button>
    </div>

    <!-- Sign-in ---------------------------------------------------------- -->
    <div class="pga-login" id="pga-login" hidden>
        <h2>Gallery admin</h2>
        <p>Enter the gallery admin passphrase to upload photos, tag people and manage albums.</p>
        <form id="pga-login-form" novalidate>
            <div class="pga-field">
                <label for="pga-pw">Admin passphrase</label>
                <input type="password" id="pga-pw" autocomplete="current-password" required
                       aria-describedby="pga-login-err">
            </div>
            <p class="pga-error" id="pga-login-err" role="alert"></p>
            <button class="pga-btn pga-btn-primary" type="submit" id="pga-login-btn">Sign in</button>
        </form>
    </div>

    <!-- App -------------------------------------------------------------- -->
    <div id="pga-app" hidden>
        <nav class="pga-tabs" id="pga-tabs" aria-label="Admin sections"></nav>

        <div class="pga-context" id="pga-context">
            <div class="pga-context-inner">
                <div class="pga-field">
                    <label for="pga-ctx-gallery">Album</label>
                    <select id="pga-ctx-gallery"></select>
                </div>
                <div class="pga-field">
                    <label for="pga-ctx-year">Year</label>
                    <input type="number" id="pga-ctx-year" min="1990" max="2100" step="1" inputmode="numeric"
                           style="width: 7.5rem;">
                </div>
                <div class="pga-field" style="flex: 1 1 auto;"></div>
                <button class="pga-btn pga-btn-outline pga-btn-sm" type="button" id="pga-new-category">
                    + New album
                </button>
            </div>
        </div>

        <main class="pga-wrap" id="pga-view" tabindex="-1"></main>
    </div>

    <noscript>
        <div class="pga-wrap">
            <div class="pga-panel">
                <h2>JavaScript required</h2>
                <p class="pga-hint">This admin tool needs JavaScript to talk to the gallery
                service. Please enable it, or use a browser that supports it.</p>
            </div>
        </div>
    </noscript>

    <script type="module" src="/js/photogallery/admin.js"></script>
</body>
</html>
