      <path transform="translate(115,130) rotate(180) scale(4.3) translate(-12,-21)" d="M12 21 C12 21 3 13.5 3 8.5 C3 5.5 5.5 3 8.5 3 C10.5 3 12 4.5 12 6 C12 4.5 13.5 3 15.5 3 C18.5 3 21 5.5 21 8.5 C21 13.5 12 21 12 21 Z"/>
      <path transform="translate(115,130) rotate(270) scale(4.3) translate(-12,-21)" d="M12 21 C12 21 3 13.5 3 8.5 C3 5.5 5.5 3 8.5 3 C10.5 3 12 4.5 12 6 C12 4.5 13.5 3 15.5 3 C18.5 3 21 5.5 21 8.5 C21 13.5 12 21 12 21 Z"/>
