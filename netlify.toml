# Netlify configuration for SPARC website
#
# Netlify serves sparcsolutions.org and www.sparcsolutions.org from this
# repository, so the rules below apply to the live site — not just to
# main--sparcwebsite.netlify.app and deploy previews. Treat edits here as
# production changes.
#
# Because Netlify handles rewrites, proxies and headers, a path on the live
# domain does NOT have to be a real file in this repo: a `status = 200`
# redirect can proxy it from another site (see /accessibility below).
#
# The repo still carries CNAME and .nojekyll from an earlier GitHub Pages
# setup. They are inert under Netlify; left in place deliberately rather than
# removed as part of an unrelated change.

[build]
  publish = "."

# Steps Toward Access app — proxied from its own Netlify site.
# Must precede the catch-all pretty-URL rule; force=true so no local
# file can shadow it. The app is built with basePath /accessibility.
[[redirects]]
  from = "/accessibility"
  to = "https://stepstowardaccess.netlify.app/accessibility"
  status = 200
  force = true

[[redirects]]
  from = "/accessibility/*"
  to = "https://stepstowardaccess.netlify.app/accessibility/:splat"
  status = 200
  force = true

# Redirect board-portal.html to board-portal directory
[[redirects]]
  from = "/board-portal.html"
  to = "/board-portal/"
  status = 301

# Blog has been consolidated into the News page
[[redirects]]
  from = "/blog"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "/news/"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/news/"
  status = 301

# Enable pretty URLs (removes .html extension)
[[redirects]]
  from = "/*"
  to = "/:splat.html"
  status = 200
  force = false

# Redirect home.html to root
[[redirects]]
  from = "/home"
  to = "/"
  status = 301

# Root serves home.html
[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
